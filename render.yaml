# Minimal Render blueprint for the MenoMate FastAPI backend.
# Manual steps in the Render dashboard: create a Web Service from this repo
# (or `render blueprint launch`), then set the SECRET env vars below.
# No deploy is performed from this repository itself.
services:
  - type: web
    name: menomate-core
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: ""
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
